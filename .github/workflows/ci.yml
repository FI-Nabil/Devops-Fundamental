name: Build and Push

on: [push]

permissions:
  contents: read
  packages: write

jobs:
  lint:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Lint docker-compose.yml (syntax + schema check)
          run: docker compose -f ./Assignment-04/node-docker-app/docker-compose.yml config

        - name: Lint server.js (syntax check)
          run: node --check ./Assignment-04/node-docker-app/server.js
  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (local tag)
        run: docker build -t localhost:5000/my-node-app:${{ steps.vars.outputs.sha_short }} ./Assignment-04/node-docker-app

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (GHCR tag)
        run: docker build -t ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/my-node-app:${{ steps.vars.outputs.sha_short }} ./Assignment-04/node-docker-app

      - name: Cleanup old images if more than 5 exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                PACKAGE=my-node-app
                VERSIONS=$(gh api \
                  -H "Accept: application/vnd.github+json" \
                  "/users/${OWNER}/packages/container/${PACKAGE}/versions" \
                  --paginate)

                COUNT=$(echo "$VERSIONS" | jq 'length')
                echo "Current image count in registry: $COUNT"

                if [ "$COUNT" -gt 5 ]; then
                  OLDEST_ID=$(echo "$VERSIONS" | jq -r 'sort_by(.created_at) | .[0].id')
                  OLDEST_TAG=$(echo "$VERSIONS" | jq -r 'sort_by(.created_at) | .[0].metadata.container.tags[0]')
                  echo "More than 5 images found. Deleting oldest: id=$OLDEST_ID tag=$OLDEST_TAG"
                  gh api \
                    --method DELETE \
                    -H "Accept: application/vnd.github+json" \
                    "/users/${OWNER}/packages/container/${PACKAGE}/versions/${OLDEST_ID}"
                else
                  echo "5 or fewer images exist — no cleanup needed."
                fi    
      - name: Push to GitHub Container Registry
        run: docker push ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/my-node-app:${{ steps.vars.outputs.sha_short }}
