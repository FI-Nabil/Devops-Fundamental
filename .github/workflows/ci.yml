name: Build and Push

on: [push]

jobs:
  lint:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Lint docker-compose.yml (syntax + schema check)
          run: docker compose -f ./Assignment-04/node-docker-app/docker-compose.yml config

        - name: Lint server.js (syntax check)
          run: node --check ./Assignment-04/node-docker-app/server.js
  build-and-push:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (local tag)
        run: docker build -t localhost:5000/my-node-app:${{ steps.vars.outputs.sha_short }} ./Assignment-04/node-docker-app

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (GHCR tag)
        run: docker build -t ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/my-node-app:${{ steps.vars.outputs.sha_short }} ./Assignment-04/node-docker-app

      - name: Push to GitHub Container Registry
        run: docker push ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/my-node-app:${{ steps.vars.outputs.sha_short }}